<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>춤으로 답하기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d6ecff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <div class="left">
    <div id="stage"></div>
    <div class="bar">
      <button id="sound">소리 켜기</button>
      <button id="rec">녹화 시작</button>
      <button id="snap">사진 저장</button>
      <button id="only">화면만</button>
      <button id="again">처음부터</button>
      <span class="fps" id="fps"></span>
    </div>
  </div>

  <aside>
    <div class="card">
      <h2>무엇을 보나</h2>
      <select id="source">
        <option value="camera">카메라</option>
        <option value="sim">가짜 관객</option>
        <option value="file">영상 파일 열기…</option>
      </select>
      <input type="file" id="file" accept="video/*" hidden />
      <div id="status">시작하는 중</div>
    </div>

    <div class="card">
      <h2>읽은 춤 (여섯 가지는 web/quality.js)</h2>
      <canvas id="preview" width="256" height="192"></canvas>
      <div class="meter"><span>움직임</span><i><b id="m-amount"></b></i><output id="v-amount"></output></div>
      <div class="meter"><span>답하는 중</span><i><b id="m-answer"></b></i><output id="v-answer"></output></div>
      <div class="meter"><span>빠르기</span><i><b id="m-tempo"></b></i><output id="v-tempo"></output></div>
      <div class="meter"><span>크기</span><i><b id="m-size"></b></i><output id="v-size"></output></div>
      <div class="meter"><span>결(날카로움)</span><i><b id="m-sharp"></b></i><output id="v-sharp"></output></div>
      <div class="hint" id="reading">아직 답을 받지 않았습니다</div>
    </div>

    <div class="card">
      <h2>대화 (규칙은 web/turn.js)</h2>
      <div id="phase">기다림</div>
      <div class="meter out"><span>주고받음</span><i><b id="m-turn"></b></i><output id="v-turn"></output></div>
      <div class="hint" id="phrasenote">문장을 짓는 중</div>
      <div class="hint" id="artnote">자료를 읽는 중</div>
    </div>

    <div class="card">
      <h2>조절</h2>
      <div id="params"></div>
      <button id="reset" style="margin-top:6px">처음 값으로</button>
    </div>

    <div class="card keys">
      H 조절판 숨기기 · F 전체 화면 · R 녹화 · 스페이스 처음부터<br />
      조절한 값은 이 브라우저에 남습니다.
    </div>
  </aside>
</div>
<video id="video" playsinline muted></video>
<script src="vendor/p5/p5.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
